name: peek-mcp

services:
  peek-server:
    container_name: peek-server
    build: .
    image: peek-server:local
    user: "${PEEK_UID:-10001}:${PEEK_GID:-10001}"
    environment:
      HOME: /tmp
      PEEK_ROOT: /workspace
    volumes:
      - type: bind
        source: ${PROJECT_PATH:?Set PROJECT_PATH}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    tmpfs:
      - /tmp:size=16m,nosuid,nodev,noexec
    networks:
      - peek-backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure:3


  peek-tunnel:
    container_name: peek-tunnel
    build:
      context: "https://github.com/openai/tunnel-client.git#${TUNNEL_CLIENT_VERSION:-v0.0.10}"
      args:
        GIT_SHA: ${TUNNEL_CLIENT_VERSION:-v0.0.10}
    image: peek-tunnel:local
    command:
      - --control-plane.api-key=env:CONTROL_PLANE_API_KEY
      - --control-plane.tunnel-id=${PEEK_TUNNEL_ID:?Set PEEK_TUNNEL_ID in .env}
      - --mcp.server-url=http://peek-server:8000/mcp
    user: "65532:65532"
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      HOME: /tmp
      CONTROL_PLANE_API_KEY: ${PEEK_CONTROL_PLANE_API_KEY:?Set PEEK_CONTROL_PLANE_API_KEY in .env}
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - peek-backend
      - peek-egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    depends_on:
      peek-server:
        condition: service_healthy
    restart: on-failure:3

networks:
  peek-backend:
    internal: true

  peek-egress: {}
